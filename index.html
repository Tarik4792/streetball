<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streetball</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;display:flex;flex-direction:column;align-items:center;padding:1rem;font-family:sans-serif;color:#eee;user-select:none}
h1{font-size:24px;font-weight:600;margin-bottom:8px;letter-spacing:1px}
#sbar{display:flex;gap:24px;align-items:center;margin-bottom:8px;font-size:13px}
.snum{font-size:30px;font-weight:700}
#cw{border-radius:8px;overflow:hidden;border:2px solid #333;cursor:none}
canvas{display:block}
#ctrl{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{padding:7px 16px;font-size:13px;border-radius:6px;border:1px solid #555;background:transparent;color:#eee;cursor:pointer;font-family:inherit}
button:hover{background:#333}
select,input[type=text]{font-size:12px;padding:4px 7px;border-radius:5px;border:1px solid #555;background:#222;color:#eee;font-family:inherit}
input[type=text]{width:100px;text-align:center}
input[type=color]{width:26px;height:26px;border:1px solid #555;border-radius:4px;cursor:pointer;padding:1px}
#setup{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;justify-content:center;margin-bottom:10px;padding:10px 14px;border:1px solid #333;border-radius:8px;background:#222}
.ps{display:flex;flex-direction:column;gap:5px;align-items:center;font-size:12px;font-weight:600}
.cr{display:flex;gap:4px;align-items:center;font-size:11px;color:#aaa}
.mo{display:flex;flex-direction:column;gap:6px;align-items:center}
#csr{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.cb{padding:5px 10px;font-size:11px;border-radius:20px;border:1px solid #555;background:transparent;color:#aaa;cursor:pointer;font-family:inherit}
.cb.on{border-color:#aaa;color:#fff;background:#333;font-weight:600}
#info{margin-top:6px;font-size:11px;text-align:center;color:#888}
#bpanel{margin-top:8px;padding:10px;border:1px solid #333;border-radius:8px;width:640px;font-size:12px;background:#222}
</style>
</head>
<body>
<h1>🏆 Streetball</h1>
<div id="csr">
  <span style="font-size:11px;color:#888">court:</span>
  <button class="cb on" data-c="street">🧱 Street</button>
  <button class="cb" data-c="night">🌙 Night</button>
  <button class="cb" data-c="beach">🏖️ Beach</button>
  <button class="cb" data-c="rooftop">🏙️ Rooftop</button>
  <button class="cb" data-c="park">🌲 Park</button>
  <button class="cb" data-c="winter">❄️ Winter</button>
</div>
<div id="setup">
  <div class="ps">Player 1 (mouse)
    <div class="cr">shirt<input type="color" id="c1s" value="#1a6db5"> pants<input type="color" id="c1p" value="#2a2a6a"> hair<input type="color" id="c1h" value="#222"></div>
    <input type="text" id="n1" value="Player 1">
  </div>
  <div class="mo">
    <div class="cr">mode<select id="md"><option value="1p">vs CPU</option><option value="2p">2 players</option></select></div>
    <div class="cr">level<select id="dv"><option value="easy" selected>easy</option><option value="medium">medium</option><option value="hard">hard</option></select></div>
  </div>
  <div class="ps">Player 2 (A/D)
    <div class="cr">shirt<input type="color" id="c2s" value="#b52020"> pants<input type="color" id="c2p" value="#5a1a1a"> hair<input type="color" id="c2h" value="#8B4513"></div>
    <input type="text" id="n2" value="Player 2">
  </div>
</div>
<div id="sbar">
  <div style="text-align:center"><div class="snum" id="s1">0</div><div id="l1">Player 1</div></div>
  <div style="opacity:0.4">•</div>
  <div id="si" style="font-size:11px;text-align:center">set 1 of 3</div>
  <div style="opacity:0.4">•</div>
  <div style="text-align:center"><div class="snum" id="s2">0</div><div id="l2">Player 2</div></div>
</div>
<div id="cw"><canvas id="gc" width="640" height="440"></canvas></div>
<div id="ctrl">
  <button id="bstart">start game</button>
  <button id="bpause">pause</button>
  <button id="bmute">mute</button>
</div>
<div id="info">Move mouse to hit the ball · flick fast for power shot · first to 11 wins each set</div>
<div id="bpanel"><b>Tournament</b> — best of 3 sets<br><div id="brac" style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap"></div></div>

<script>
const cv=document.getElementById('gc'),ctx=cv.getContext('2d');
const W=640,H=440,WH=108,FY=H-55;
let court='street',mode='1p',diff='easy',state='idle';
let animId=null,lastT=0,mouseX=W/2,keys={};
let p1s=0,p2s=0,curSet=1,setScores={p1:[],p2:[]};
let muted=false,aCtx=null;
const SPD={easy:230,medium:320,hard:430};
const ANG={easy:45,medium:55,hard:65};
let P1={x:W/2,s:'#1a6db5',p:'#2a2a6a',h:'#222',name:'Player 1',pw:0,lmx:W/2,spd:0,leg:0,arm:0};
let P2={x:W/2,s:'#b52020',p:'#5a1a1a',h:'#8B4513',name:'Player 2',pw:0,leg:0,arm:0};
let CPU={x:W/2,tx:W/2,leg:0,arm:0};
let ball={x:W/2,y:FY-80,vx:0,vy:0,r:11,trail:[],pow:false};
let parts=[],flt=0,flc='',mt=0,ms='',mc='';
let stars=[],snow=[];
for(let i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*WH*.9,r:Math.random()*1.4+.3,t:Math.random()*6.28});
for(let i=0;i<60;i++)snow.push({x:Math.random()*W,y:Math.random()*H,vy:20+Math.random()*35,vx:(Math.random()-.5)*12,r:1.5+Math.random()*2,a:Math.random()*6.28});
function au(){if(!aCtx)aCtx=new(window.AudioContext||window.webkitAudioContext)();return aCtx;}
function bp(f,d,t,v){if(muted)return;try{const a=au(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.13,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.start();o.stop(a.currentTime+d);}catch(e){}}
const sW=()=>bp(300,.07,'square',.12);
const sH=()=>bp(480,.09,'sine',.15);
const sP=()=>{bp(160,.05,'sawtooth',.13);setTimeout(()=>bp(400,.14,'sine',.18),40);};
const sSc=()=>{bp(660,.09,'sine',.17);setTimeout(()=>bp(880,.12,'sine',.17),110);setTimeout(()=>bp(1100,.18,'sine',.17),240);};
const sM=()=>{bp(200,.07,'sawtooth',.12);setTimeout(()=>bp(140,.16,'sawtooth',.1),90);};
const sWn=()=>[0,150,300,480].forEach((d,i)=>setTimeout(()=>bp([660,780,880,1100][i],.18,'sine',.2),d));
function resetBall(){const spd=SPD[diff]||230,a=(Math.random()*50+20)*Math.PI/180*(Math.random()<.5?1:-1);ball={x:W/2,y:FY-80,vx:Math.sin(a)*spd,vy:-Math.cos(a)*spd,r:11,trail:[],pow:false};}
function initGame(){p1s=0;p2s=0;updateHUD();parts=[];resetBall();state='playing';ms='';flt=0;P1.pw=0;P2.pw=0;P1.leg=0;P1.arm=0;P2.leg=0;P2.arm=0;CPU.leg=0;CPU.arm=0;CPU.x=W/2;CPU.tx=W/2;}
function startT(){setScores={p1:[],p2:[]};curSet=1;updateBracket();initGame();}
function updateHUD(){document.getElementById('s1').textContent=p1s;document.getElementById('s2').textContent=p2s;document.getElementById('si').textContent='set '+curSet+' of 3';}
function updateBracket(){
  const el=document.getElementById('brac');let h='';
  for(let i=0;i<3;i++){const a=setScores.p1[i]!==undefined?setScores.p1[i]:'—',b=setScores.p2[i]!==undefined?setScores.p2[i]:'—',aw=setScores.p1[i]!==undefined&&setScores.p2[i]!==undefined&&setScores.p1[i]>setScores.p2[i],bw=setScores.p2[i]!==undefined&&setScores.p1[i]!==undefined&&setScores.p2[i]>setScores.p1[i];
  h+=`<div style="border:1px solid #444;border-radius:5px;overflow:hidden;min-width:110px"><div style="padding:3px 7px;display:flex;justify-content:space-between;${aw?'color:#5de8a0;font-weight:700':'color:#888'}">${P1.name}<span>${a}</span></div><div style="padding:3px 7px;display:flex;justify-content:space-between;${bw?'color:#5de8a0;font-weight:700':'color:#888'}">${P2.name}<span>${b}</span></div></div>`;}
  const w1=setScores.p1.filter((s,i)=>s>(setScores.p2[i]||0)).length,w2=setScores.p2.filter((s,i)=>s>(setScores.p1[i]||0)).length,done=w1===2||w2===2||setScores.p1.length===3,champ=done?(w1>=w2?P1.name:P2.name):'TBD';
  h+=`<div style="border:1px solid #444;border-radius:5px;padding:4px 8px;${done?'color:#ffd700;font-weight:700':'color:#888'}">🏆 ${champ}</div>`;
  el.innerHTML=h;
}
function endSet(){
  setScores.p1.push(p1s);setScores.p2.push(p2s);
  const w1=setScores.p1.filter((s,i)=>s>(setScores.p2[i]||0)).length,w2=setScores.p2.filter((s,i)=>s>(setScores.p1[i]||0)).length;updateBracket();
  if(w1===2||w2===2||curSet>=3){state='gameover';const ch=w1>=w2?P1.name:P2.name;ms=ch+' wins the tournament!';mc='#ffd700';mt=999;sWn();}
  else{curSet++;const sw=p1s>p2s?P1.name:P2.name;ms=sw+' wins set '+(curSet-1)+'!';mc='#5de8a0';mt=2.4;state='scored';sWn();setTimeout(()=>{if(state==='scored'){initGame();updateBracket();}},2600);}
}
function sp(x,y,c,n){for(let i=0;i<(n||10);i++){const a=Math.random()*6.28,s=50+Math.random()*100;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:2+Math.random()*3,c});}}
function drawBricks(x0,y0,w,h,dk,lt){
  const bW=38,bH=18,rows=Math.ceil(h/bH)+1,cols=Math.ceil(w/bW)+2;
  ctx.save();ctx.beginPath();ctx.rect(x0,y0,w,h);ctx.clip();
  for(let r=0;r<rows;r++){const off=(r%2)*bW/2;ctx.fillStyle=r%2===0?(dk||'#a33e27'):(lt||'#cc5e42');for(let c=-1;c<cols;c++)ctx.fillRect(x0+c*bW-off+1,y0+r*bH+1,bW-2,bH-2);ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=.5;for(let c=-1;c<cols;c++)ctx.strokeRect(x0+c*bW-off+1,y0+r*bH+1,bW-2,bH-2);}
  ctx.restore();
}
function cL(col){ctx.strokeStyle=col||'rgba(255,255,255,.5)';ctx.lineWidth=1.5;ctx.strokeRect(1,1,W-2,WH);ctx.lineWidth=1;ctx.setLineDash([8,8]);ctx.strokeStyle=(col||'rgba(255,255,255,.5)').replace(/[\d.]+\)$/,'.3)');ctx.beginPath();ctx.moveTo(0,WH+65);ctx.lineTo(W,WH+65);ctx.stroke();ctx.beginPath();ctx.moveTo(W/2,WH);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);}
function drawCourt(){
  const t=Date.now()/1000;ctx.clearRect(0,0,W,H);
  if(court==='street'){ctx.fillStyle='#c8a86b';ctx.fillRect(0,WH,W,H-WH);for(let y=WH+28;y<H;y+=28){ctx.strokeStyle='#b8945a';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}drawBricks(0,0,W,WH);cL();}
  else if(court==='night'){const sk=ctx.createLinearGradient(0,0,0,WH);sk.addColorStop(0,'#05050f');sk.addColorStop(1,'#0a0a2a');ctx.fillStyle=sk;ctx.fillRect(0,0,W,WH);stars.forEach(s=>{const tw=.5+.5*Math.sin(t*1.2+s.t);ctx.fillStyle=`rgba(255,255,255,${.4+.6*tw})`;ctx.beginPath();ctx.arc(s.x,s.y*.9+5,s.r*tw,0,Math.PI*2);ctx.fill();});ctx.fillStyle='#fffde0';ctx.beginPath();ctx.arc(W-60,28,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0a0a1a';ctx.beginPath();ctx.arc(W-53,24,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1a1a2e';ctx.fillRect(0,WH,W,H-WH);for(let y=WH+28;y<H;y+=28){ctx.strokeStyle='rgba(80,80,160,.3)';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}drawBricks(0,0,W,WH,'#1a1a3a','#22224a');[[80,WH],[W-80,WH]].forEach(([lx,ly])=>{const lg=ctx.createRadialGradient(lx,ly,0,lx,ly,160);lg.addColorStop(0,'rgba(255,240,180,.22)');lg.addColorStop(1,'rgba(255,240,180,0)');ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffe080';ctx.beginPath();ctx.arc(lx,ly-4,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#888';ctx.fillRect(lx-3,ly-18,6,14);});cL('rgba(100,140,255,.6)');}
  else if(court==='beach'){const sk=ctx.createLinearGradient(0,0,0,WH);sk.addColorStop(0,'#1a78d0');sk.addColorStop(1,'#7ec8f0');ctx.fillStyle=sk;ctx.fillRect(0,0,W,WH);ctx.fillStyle='#ffe033';ctx.beginPath();ctx.arc(80,30,22,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,220,50,.4)';ctx.lineWidth=8;ctx.stroke();ctx.fillStyle='#2a8fbf';ctx.fillRect(0,WH-30,W,35);for(let wx=0;wx<W+40;wx+=40){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(wx+Math.sin(t+wx*.05)*8,WH-18);ctx.bezierCurveTo(wx+10,WH-24,wx+25,WH-12,wx+40,WH-18);ctx.stroke();}const sand=ctx.createLinearGradient(0,WH,0,H);sand.addColorStop(0,'#e8c97a');sand.addColorStop(1,'#d4b060');ctx.fillStyle=sand;ctx.fillRect(0,WH,W,H-WH);drawBricks(0,0,W,WH-30,'#b09060','#c8a870');cL('rgba(255,255,255,.55)');[30,W-30].forEach(tx=>{ctx.strokeStyle='#7a5a20';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(tx,WH+40);ctx.quadraticCurveTo(tx+10,WH,tx+5,WH-20);ctx.stroke();[[0,-1.2,28],[.5,-.9,24],[-.5,-.9,22]].forEach(([a,uy,l])=>{ctx.strokeStyle='#3a8a20';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(tx+5,WH-20);ctx.lineTo(tx+5+Math.cos(a)*l,WH-20+uy*l*.5);ctx.stroke();});});}
  else if(court==='rooftop'){const sk=ctx.createLinearGradient(0,0,0,WH);sk.addColorStop(0,'#ff7043');sk.addColorStop(.5,'#ff9a44');sk.addColorStop(1,'#ffd080');ctx.fillStyle=sk;ctx.fillRect(0,0,W,WH);[[0,50,60],[55,65,50],[100,40,70],[165,75,45],[205,55,60],[260,85,40],[295,50,55],[345,70,50],[390,45,60],[445,60,50],[490,80,45],[530,50,65],[590,65,55]].forEach(([bx,bh,bw])=>{ctx.fillStyle='rgba(30,25,50,.7)';ctx.fillRect(bx,WH-bh,bw,bh);});ctx.fillStyle='#555566';ctx.fillRect(0,WH,W,H-WH);for(let y=WH+30;y<H;y+=30){ctx.strokeStyle='rgba(100,100,130,.4)';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}ctx.fillStyle='#3a3a5a';ctx.fillRect(0,0,W,WH);for(let wx=0;wx<W;wx+=48){ctx.fillStyle='rgba(100,120,200,.12)';ctx.fillRect(wx+2,2,44,WH-4);}cL('rgba(120,180,255,.6)');}
  else if(court==='park'){const sk=ctx.createLinearGradient(0,0,0,WH);sk.addColorStop(0,'#5bb8f0');sk.addColorStop(1,'#a8d8f0');ctx.fillStyle=sk;ctx.fillRect(0,0,W,WH);[[80+Math.sin(t/4)*30,25,50,22],[300+Math.cos(t/5.7)*20,18,70,18],[520+Math.sin(t/8)*25,30,55,20]].forEach(([cx,cy,cw,ch])=>{ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.ellipse(cx,cy,cw,ch,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(cx-20,cy+5,cw*.7,ch*.8,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(cx+20,cy+5,cw*.7,ch*.8,0,0,Math.PI*2);ctx.fill();});const gr=ctx.createLinearGradient(0,WH,0,H);gr.addColorStop(0,'#5aaa44');gr.addColorStop(1,'#3d8030');ctx.fillStyle=gr;ctx.fillRect(0,WH,W,H-WH);ctx.fillStyle='#8fbc5a';ctx.fillRect(40,WH+20,W-80,H-WH-20);drawBricks(0,0,W,WH,'#6a7a5a','#7d8f6a');cL('rgba(255,255,255,.55)');[25,W-25].forEach(tx=>{const sw=Math.sin(t+tx)*2;ctx.strokeStyle='#5a3a10';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(tx,WH+5);ctx.lineTo(tx+sw,WH-30);ctx.stroke();[[0,0,20],[0,-18,16],[0,-30,12]].forEach(([ox,oy,r])=>{ctx.fillStyle='#2d7a20';ctx.beginPath();ctx.arc(tx+ox+sw*.5,WH-30+oy,r,0,Math.PI*2);ctx.fill();});});}
  else if(court==='winter'){const sk=ctx.createLinearGradient(0,0,0,WH);sk.addColorStop(0,'#b0cce0');sk.addColorStop(1,'#ddeeff');ctx.fillStyle=sk;ctx.fillRect(0,0,W,WH);ctx.fillStyle='#c8dce8';[[0,80,120],[80,60,180],[200,70,160],[320,50,200],[460,65,180],[560,75,140]].forEach(([mx,mh,mw])=>{ctx.beginPath();ctx.moveTo(mx,WH);ctx.lineTo(mx+mw/2,WH-mh);ctx.lineTo(mx+mw,WH);ctx.fill();});ctx.fillStyle='rgba(255,255,255,.85)';[[60,80,40],[170,60,30],[290,70,35],[420,50,28],[550,65,32]].forEach(([mx,mh,sw])=>{ctx.beginPath();ctx.moveTo(mx,WH-mh+20);ctx.lineTo(mx+sw/2,WH-mh);ctx.lineTo(mx+sw,WH-mh+20);ctx.fill();});const ic=ctx.createLinearGradient(0,WH,0,H);ic.addColorStop(0,'#ddeeff');ic.addColorStop(1,'#b8d4e8');ctx.fillStyle=ic;ctx.fillRect(0,WH,W,H-WH);drawBricks(0,0,W,WH,'#7a8a9a','#8a9aaa');ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(0,0,W,12);for(let sx=0;sx<W;sx+=18){ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(sx,12,8+Math.sin(sx)*3,0,Math.PI*2);ctx.fill();}cL('rgba(180,210,240,.7)');snow.forEach(s=>{ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});}
}
function drawShadow(x,y){ctx.fillStyle='rgba(0,0,0,.13)';ctx.beginPath();ctx.ellipse(x,y,20,5,0,0,Math.PI*2);ctx.fill();}
function drawPlayer(x,yB,shirt,pants,hair,facing,leg,arm,label,pw){
  ctx.save();const sw=Math.sin(leg)*.28,al=arm,HR=11,BH=26,LH=20,AH=18,hy=yB-BH-HR*2+2;
  ctx.fillStyle=pants;ctx.save();ctx.translate(x-5,yB);ctx.rotate(sw);ctx.beginPath();ctx.roundRect(-5,0,10,LH,3);ctx.fill();ctx.restore();ctx.save();ctx.translate(x+5,yB);ctx.rotate(-sw);ctx.beginPath();ctx.roundRect(-5,0,10,LH,3);ctx.fill();ctx.restore();
  ctx.fillStyle='#111';ctx.save();ctx.translate(x-5,yB+LH-2);ctx.rotate(sw);ctx.beginPath();ctx.ellipse(facing>0?2:-2,4,7,3,0,0,Math.PI*2);ctx.fill();ctx.restore();ctx.save();ctx.translate(x+5,yB+LH-2);ctx.rotate(-sw);ctx.beginPath();ctx.ellipse(facing>0?2:-2,4,7,3,0,0,Math.PI*2);ctx.fill();ctx.restore();
  ctx.fillStyle=shirt;ctx.beginPath();ctx.roundRect(x-13,yB-BH,26,BH,4);ctx.fill();ctx.fillStyle='rgba(255,255,255,.45)';ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.fillText(facing>0?'1':'2',x,yB-BH+13);
  ctx.fillStyle='#f0c080';ctx.save();ctx.translate(x-13,yB-BH+5);ctx.rotate(-.3-sw-al*1.1);ctx.beginPath();ctx.roundRect(-4,0,8,AH,3);ctx.fill();ctx.restore();ctx.save();ctx.translate(x+13,yB-BH+5);ctx.rotate(.3+sw+al*1.1);ctx.beginPath();ctx.roundRect(-4,0,8,AH,3);ctx.fill();ctx.restore();
  ctx.fillStyle='#f0c080';ctx.beginPath();ctx.arc(x,hy+HR,HR,0,Math.PI*2);ctx.fill();ctx.fillStyle=hair;ctx.beginPath();ctx.arc(x,hy+HR,HR,Math.PI,0);ctx.fill();ctx.beginPath();ctx.rect(x-HR,hy,HR*2,HR+2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x+(facing>0?3:-3),hy+HR+2,1.8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c07040';ctx.beginPath();ctx.arc(x,hy+HR+5,2.5,0,Math.PI);ctx.fill();
  if(label){const tag=label+(pw>.5?' ⚡':'');const tw=ctx.measureText(tag).width+14;ctx.fillStyle=pw>.5?'rgba(200,75,0,.85)':'rgba(0,0,0,.7)';ctx.beginPath();ctx.roundRect(x-tw/2,hy-18,tw,13,4);ctx.fill();ctx.fillStyle='#fff';ctx.font='500 9px sans-serif';ctx.textAlign='center';ctx.fillText(tag,x,hy-7);}
  if(pw>0){ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(x-18,hy-26,36,4);ctx.fillStyle=pw>.7?'#ff4400':'#ffaa00';ctx.fillRect(x-18,hy-26,36*pw,4);}
  ctx.restore();
}
function drawBall(){if(state==='idle')return;ball.trail.forEach((tr,i)=>{const a=(i/ball.trail.length)*.25;ctx.beginPath();ctx.arc(tr.x,tr.y,ball.r*(i/ball.trail.length)*.8,0,Math.PI*2);ctx.fillStyle=ball.pow?`rgba(255,120,0,${a})`:`rgba(30,180,255,${a})`;ctx.fill();});const g=ctx.createRadialGradient(ball.x-3,ball.y-3,2,ball.x,ball.y,ball.r);g.addColorStop(0,ball.pow?'#ffaa44':'#5de8ff');g.addColorStop(1,ball.pow?'#cc4400':'#0a7aaa');ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.arc(ball.x-3,ball.y-3,4,0,Math.PI*2);ctx.fill();}
function update(dt){
  if(state!=='playing')return;
  if(court==='winter')snow.forEach(s=>{s.y+=s.vy*dt;s.x+=s.vx*dt+Math.sin(s.a)*.3;s.a+=dt;if(s.y>H)s.y=-5;if(s.x>W)s.x=0;if(s.x<0)s.x=W;});
  P1.spd=Math.abs(mouseX-P1.lmx)/dt;P1.lmx=mouseX;P1.x+=(mouseX-P1.x)*.18;P1.x=Math.max(20,Math.min(W-20,P1.x));P1.leg+=Math.abs(mouseX-P1.x)>3?dt*5:0;if(P1.spd>380)P1.pw=Math.min(1,P1.pw+dt*2.5);else P1.pw=Math.max(0,P1.pw-dt*1.5);if(P1.arm>0)P1.arm-=dt*2;
  if(mode==='2p'){if(keys['a']||keys['arrowleft'])P2.x=Math.max(20,P2.x-310*dt);if(keys['d']||keys['arrowright'])P2.x=Math.min(W-20,P2.x+310*dt);P2.leg+=(keys['a']||keys['d']||keys['arrowleft']||keys['arrowright'])?dt*5:0;if(keys['s']||keys['arrowdown'])P2.pw=Math.min(1,P2.pw+dt*1.3);else P2.pw=Math.max(0,P2.pw-dt*2);if(P2.arm>0)P2.arm-=dt*2;}
  else{CPU.tx=ball.x+(Math.random()-.5)*25;CPU.x+=(CPU.tx-CPU.x)*.08;CPU.x=Math.max(20,Math.min(W-20,CPU.x));CPU.leg+=dt*4;if(CPU.arm>0)CPU.arm-=dt*2;}
  ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>9)ball.trail.shift();
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vy+=90*dt;
  if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx);sW();sp(ball.x,ball.y,'#fff',4);}
  if(ball.x+ball.r>W){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx);sW();sp(ball.x,ball.y,'#fff',4);}
  if(ball.y-ball.r<WH){ball.y=WH+ball.r;ball.vy=Math.abs(ball.vy)*.82;sSc();p1s++;updateHUD();sp(ball.x,ball.y,'#5de8a0',18);flc='#5de8a0';flt=.5;ms='+1 point!';mc='#5de8a0';mt=.9;if(p1s>=11){endSet();return;}state='scored';setTimeout(()=>{if(state==='scored'){resetBall();state='playing';}},900);return;}
  const p1HY=FY-55;
  if(ball.vy>0&&ball.y+ball.r>=p1HY&&ball.y+ball.r<=p1HY+26&&Math.abs(ball.x-P1.x)<26){const rel=(ball.x-P1.x)/26,ma=(ANG[diff]||45)*Math.PI/180,spd=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy)*(P1.pw>.6?1.5:1.05);ball.vx=Math.sin(rel*ma)*spd;ball.vy=-Math.cos(rel*ma)*spd;ball.y=p1HY-ball.r;ball.pow=P1.pw>.6;if(ball.pow){sP();sp(ball.x,p1HY,'#ff8800',14);}else{sH();sp(ball.x,p1HY,'#fff8e0',7);}P1.arm=1;P1.pw=0;}
  const p2HY=FY-168,hx=mode==='2p'?P2.x:CPU.x;
  if(ball.vy>0&&ball.y+ball.r>=p2HY&&ball.y+ball.r<=p2HY+26&&Math.abs(ball.x-hx)<26){const rel=(ball.x-hx)/26,ma=mode==='2p'?(ANG[diff]||45)*Math.PI/180:.4,base=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy),isPow=mode==='2p'&&P2.pw>.6,boost=isPow?1.4:mode==='2p'?.9:.85;ball.vx=Math.sin(rel*ma)*base*boost;ball.vy=-Math.cos(rel*ma)*base*boost*.85;ball.y=p2HY-ball.r;ball.pow=isPow;if(isPow){sP();sp(ball.x,p2HY,'#ff8800',14);}else{sH();sp(ball.x,p2HY,'#ffcc88',7);}if(mode==='2p'){P2.arm=1;P2.pw=0;}else CPU.arm=1;}
  if(ball.y-ball.r>H){sM();p2s++;updateHUD();sp(ball.x,H-20,'#ff7a6a',14);flc='#ff7a6a';flt=.5;ms='miss!';mc='#ff7a6a';mt=.9;if(p2s>=11){endSet();return;}state='scored';setTimeout(()=>{if(state==='scored'){resetBall();state='playing';}},900);}
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;p.life-=dt*1.8;});parts=parts.filter(p=>p.life>0);if(flt>0)flt-=dt;if(mt>0)mt-=dt;
}
function render(){
  drawCourt();
  if(flt>0){ctx.fillStyle=flc;ctx.globalAlpha=flt*.18;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  if(state!=='idle'){
    const hx=mode==='2p'?P2.x:CPU.x,hleg=mode==='2p'?P2.leg:CPU.leg,harm=mode==='2p'?P2.arm:CPU.arm,hlabel=mode==='2p'?P2.name:'cpu',hpw=mode==='2p'?P2.pw:0;
    drawShadow(hx,FY-150+16);drawPlayer(hx,FY-150,P2.s,P2.p,P2.h,-1,hleg,harm,hlabel,hpw);
    drawBall();
    drawShadow(P1.x,FY-55+14);drawPlayer(P1.x,FY-55,P1.s,P1.p,P1.h,1,P1.leg,P1.arm,P1.name,P1.pw);
  }
  parts.forEach(p=>{ctx.globalAlpha=p.life;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fillStyle=p.c;ctx.fill();});ctx.globalAlpha=1;
  if(mt>0&&ms){ctx.save();ctx.globalAlpha=Math.min(1,mt*2);ctx.font='500 28px sans-serif';ctx.textAlign='center';ctx.fillStyle=mc||'#fff';ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=8;ctx.fillText(ms,W/2,H/2-10);ctx.restore();}
  if(state==='idle'){ctx.fillStyle='rgba(0,0,0,.48)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.font='500 30px sans-serif';ctx.fillStyle='#fff';ctx.fillText('streetball',W/2,H/2-16);ctx.font='400 14px sans-serif';ctx.fillStyle='rgba(255,255,255,.72)';ctx.fillText('pick a court · customize players · press start game',W/2,H/2+18);}
  if(state==='gameover'){ctx.fillStyle='rgba(0,0,0,.48)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.font='500 28px sans-serif';ctx.fillStyle='#ffd700';ctx.fillText(ms,W/2,H/2-10);ctx.font='400 14px sans-serif';ctx.fillStyle='rgba(255,255,255,.72)';ctx.fillText('press start game to play again',W/2,H/2+20);}
  ctx.textAlign='left';
}
function loop(ts){const dt=Math.min((ts-lastT)/1000,.05);lastT=ts;update(dt);render();animId=requestAnimationFrame(loop);}
function startLoop(){if(animId)cancelAnimationFrame(animId);lastT=performance.now();animId=requestAnimationFrame(loop);}
document.querySelectorAll('.cb').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.cb').forEach(x=>x.classList.remove('on'));b.classList.add('on');court=b.dataset.c;}));
document.getElementById('bstart').addEventListener('click',()=>{diff=document.getElementById('dv').value;mode=document.getElementById('md').value;P1.s=document.getElementById('c1s').value;P1.p=document.getElementById('c1p').value;P1.h=document.getElementById('c1h').value;P1.name=document.getElementById('n1').value||'Player 1';P2.s=document.getElementById('c2s').value;P2.p=document.getElementById('c2p').value;P2.h=document.getElementById('c2h').value;P2.name=document.getElementById('n2').value||'Player 2';document.getElementById('l1').textContent=P1.name;document.getElementById('l2').textContent=P2.name;startT();startLoop();});
document.getElementById('bpause').addEventListener('click',()=>{if(state==='playing'){state='paused';document.getElementById('bpause').textContent='resume';}else if(state==='paused'){state='playing';document.getElementById('bpause').textContent='pause';}});
document.getElementById('bmute').addEventListener('click',()=>{muted=!muted;document.getElementById('bmute').textContent=muted?'unmute':'mute';});
const cw=document.getElementById('cw');
cw.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouseX=e.clientX-r.left;});
cw.addEventListener('touchmove',e=>{e.preventDefault();const r=cv.getBoundingClientRect();mouseX=e.touches[0].clientX-r.left;},{passive:false});
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowleft','arrowright','arrowdown','arrowup',' '].includes(e.key.toLowerCase()))e.preventDefault();});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
startLoop();
</script>
</body>
